<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FútbolTV">
<meta name="theme-color" content="#0a0e1a">
<title>FútbolTV</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #111827;
    --bg3: #1a2235;
    --green: #00e676;
    --green2: #00c853;
    --red: #ff1744;
    --text: #f0f4ff;
    --muted: #8899bb;
    --border: rgba(0,230,118,0.15);
    --card: rgba(26,34,53,0.95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--green), #69ffb4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .live-badge {
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.6; }
  }

  /* ── NAV TABS ── */
  .nav-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 14px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .tab-btn.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  .tab-btn:hover { color: var(--text); }

  /* ── MAIN SECTIONS ── */
  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* ── DATE STRIP ── */
  .date-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .date-strip::-webkit-scrollbar { display: none; }

  .date-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg3);
    cursor: pointer;
    min-width: 58px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .date-pill.active {
    background: var(--green);
    border-color: var(--green);
  }

  .date-pill.active .day-name,
  .date-pill.active .day-num { color: #000; }

  .day-name { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .day-num { font-size: 20px; font-weight: 300; color: var(--text); margin-top: 2px; }

  /* ── PARTIDO CARD ── */
  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    border-radius: 3px 0 0 3px;
  }

  .match-card.live::before { background: var(--red); animation: pulse 1.5s infinite; }

  .match-card:active { transform: scale(0.98); }

  .match-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .league-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .match-time {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }

  .match-time.live-time {
    color: var(--red);
    font-weight: 700;
  }

  .teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  .team-emoji { font-size: 28px; }

  .team-name {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
  }

  .vs-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--text);
    text-align: center;
    min-width: 60px;
    letter-spacing: 2px;
  }

  .vs-score.live-score { color: var(--green); }

  /* ── CANAL CARD ── */
  .channels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .channel-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .channel-card:active { transform: scale(0.96); }
  .channel-card:hover { border-color: var(--green); }

  .channel-logo { font-size: 36px; margin-bottom: 8px; }
  .channel-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .channel-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── REPRODUCTOR ── */
  .player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    z-index: 200;
    flex-direction: column;
  }

  .player-overlay.open { display: flex; }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg2);
    flex-shrink: 0;
  }

  .player-title { font-size: 16px; font-weight: 600; }

  .close-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--text);
    font-size: 22px;
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.2); }

  .player-frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .player-frame iframe {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/9;
    border: none;
    border-radius: 12px;
    background: #000;
  }

  .no-stream {
    text-align: center;
    padding: 40px 20px;
  }

  .no-stream .icon { font-size: 48px; margin-bottom: 16px; }
  .no-stream h3 { font-size: 20px; margin-bottom: 8px; }
  .no-stream p { color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* ── ADMIN PANEL ── */
  .admin-section { max-width: 600px; margin: 0 auto; }

  .admin-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .admin-card h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }

  input, select, textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--green); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--bg2); }

  .btn-primary {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--green2); }

  .btn-danger {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
    margin-left: 8px;
  }

  .item-list { display: flex; flex-direction: column; gap: 8px; }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }

  .item-row span { flex: 1; }

  /* ── EMPTY ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--green);
    color: #000;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 50px;
    z-index: 999;
    transition: transform 0.3s;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">⚽ FútbolTV</div>
  <span class="live-badge">● EN VIVO</span>
</header>

<!-- TABS -->
<nav class="nav-tabs">
  <button class="tab-btn active" onclick="showTab('partidos')">📅 Partidos</button>
  <button class="tab-btn" onclick="showTab('canales')">📺 Canales</button>
  <button class="tab-btn" onclick="showTab('admin')">⚙️ Admin</button>
</nav>

<!-- ═══════════ PARTIDOS ═══════════ -->
<section id="tab-partidos" class="section active">

  <!-- Selector de fechas -->
  <div class="date-strip" id="dateStrip"></div>

  <!-- Lista de partidos -->
  <div id="matchList"></div>
</section>

<!-- ═══════════ CANALES ═══════════ -->
<section id="tab-canales" class="section">
  <div class="channels-grid" id="channelGrid"></div>
  <div id="emptyChannels" class="empty-state" style="display:none">
    <div class="e-icon">📺</div>
    <p>Aún no has agregado canales.<br>Ve a <strong>Admin → Canales</strong> para agregar.</p>
  </div>
</section>

<!-- ═══════════ ADMIN ═══════════ -->
<section id="tab-admin" class="section">
  <div class="admin-section">

    <!-- Agregar Partido -->
    <div class="admin-card">
      <h3>📅 Agregar Partido</h3>
      <label>Liga / Competición</label>
      <input type="text" id="mLeague" placeholder="Ej: Champions League">
      <label>Equipo Local</label>
      <input type="text" id="mHome" placeholder="Ej: Real Madrid">
      <label>Equipo Visitante</label>
      <input type="text" id="mAway" placeholder="Ej: Barcelona">
      <label>Fecha</label>
      <input type="date" id="mDate">
      <label>Hora (formato 24h)</label>
      <input type="time" id="mTime">
      <label>Estado</label>
      <select id="mStatus">
        <option value="upcoming">Próximo</option>
        <option value="live">EN VIVO</option>
        <option value="finished">Finalizado</option>
      </select>
      <label>Marcador (si aplica, ej: 2 - 1)</label>
      <input type="text" id="mScore" placeholder="Dejar vacío si no ha empezado">
      <label>Link del stream (URL del iframe o m3u8)</label>
      <textarea id="mStream" placeholder="https://..."></textarea>
      <button class="btn-primary" onclick="addMatch()">✅ Guardar Partido</button>
    </div>

    <!-- Lista partidos guardados -->
    <div class="admin-card">
      <h3>📋 Partidos guardados</h3>
      <div class="item-list" id="adminMatchList"></div>
    </div>

    <!-- Agregar Canal -->
    <div class="admin-card">
      <h3>📺 Agregar Canal</h3>
      <label>Nombre del canal</label>
      <input type="text" id="cName" placeholder="Ej: ESPN">
      <label>Emoji / Ícono</label>
      <input type="text" id="cEmoji" placeholder="📺">
      <label>Descripción corta</label>
      <input type="text" id="cDesc" placeholder="Ej: Deportes en vivo">
      <label>Link del stream</label>
      <textarea id="cStream" placeholder="https://..."></textarea>
      <button class="btn-primary" onclick="addChannel()">✅ Guardar Canal</button>
    </div>

    <!-- Lista canales -->
    <div class="admin-card">
      <h3>📋 Canales guardados</h3>
      <div class="item-list" id="adminChannelList"></div>
    </div>

    <!-- Peligro -->
    <div class="admin-card" style="border-color:rgba(255,23,68,0.3)">
      <h3 style="color:var(--red)">🗑️ Borrar todo</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Esto eliminará todos los partidos y canales guardados.</p>
      <button class="btn-primary" style="background:var(--red);color:#fff" onclick="clearAll()">Borrar todo</button>
    </div>

  </div>
</section>

<!-- ═══════════ REPRODUCTOR ═══════════ -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-header">
    <span class="player-title" id="playerTitle">Cargando...</span>
    <button class="close-btn" onclick="closePlayer()">✕</button>
  </div>
  <div class="player-frame" id="playerFrame"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
//  STORAGE HELPERS
// ══════════════════════════════════════
function getMatches() { try { return JSON.parse(localStorage.getItem('ftv_matches') || '[]'); } catch { return []; } }
function getChannels() { try { return JSON.parse(localStorage.getItem('ftv_channels') || '[]'); } catch { return []; } }
function saveMatches(d) { localStorage.setItem('ftv_matches', JSON.stringify(d)); }
function saveChannels(d) { localStorage.setItem('ftv_channels', JSON.stringify(d)); }

// ══════════════════════════════════════
//  TABS
// ══════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'canales') renderChannels();
  if (name === 'admin') renderAdminLists();
}

// ══════════════════════════════════════
//  DATE STRIP
// ══════════════════════════════════════
let selectedDate = '';

function buildDateStrip() {
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const today = new Date();

  for (let i = -2; i <= 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const iso = d.toISOString().split('T')[0];
    const pill = document.createElement('div');
    pill.className = 'date-pill' + (i === 0 ? ' active' : '');
    pill.innerHTML = `<span class="day-name">${i === 0 ? 'HOY' : days[d.getDay()]}</span><span class="day-num">${d.getDate()}</span>`;
    pill.onclick = () => {
      document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      selectedDate = iso;
      renderMatches();
    };
    if (i === 0) selectedDate = iso;
    strip.appendChild(pill);
  }
}

// ══════════════════════════════════════
//  PARTIDOS
// ══════════════════════════════════════
function renderMatches() {
  const list = document.getElementById('matchList');
  const matches = getMatches().filter(m => m.date === selectedDate);

  if (!matches.length) {
    list.innerHTML = `<div class="empty-state"><div class="e-icon">📅</div><p>No hay partidos para este día.<br>Agrega uno en <strong>Admin</strong>.</p></div>`;
    return;
  }

  // Sort by time
  matches.sort((a,b) => a.time.localeCompare(b.time));

  list.innerHTML = matches.map((m, i) => `
    <div class="match-card ${m.status === 'live' ? 'live' : ''}" onclick="openStream('${escHtml(m.home)} vs ${escHtml(m.away)}', '${escHtml(m.stream)}')">
      <div class="match-meta">
        <span class="league-name">${escHtml(m.league)}</span>
        <span class="match-time ${m.status === 'live' ? 'live-time' : ''}">${m.status === 'live' ? '● EN VIVO' : m.status === 'finished' ? 'FIN' : formatTime(m.time)}</span>
      </div>
      <div class="teams">
        <div class="team">
          <span class="team-emoji">🏟️</span>
          <span class="team-name">${escHtml(m.home)}</span>
        </div>
        <div class="vs-score ${m.status === 'live' ? 'live-score' : ''}">${m.score || 'VS'}</div>
        <div class="team">
          <span class="team-emoji">✈️</span>
          <span class="team-name">${escHtml(m.away)}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function formatTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  const hh = parseInt(h);
  return `${hh > 12 ? hh-12 : hh || 12}:${m} ${hh >= 12 ? 'PM' : 'AM'}`;
}

// ══════════════════════════════════════
//  CANALES
// ══════════════════════════════════════
function renderChannels() {
  const grid = document.getElementById('channelGrid');
  const empty = document.getElementById('emptyChannels');
  const channels = getChannels();

  if (!channels.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = channels.map(c => `
    <div class="channel-card" onclick="openStream('${escHtml(c.name)}', '${escHtml(c.stream)}')">
      <div class="channel-logo">${c.emoji || '📺'}</div>
      <div class="channel-name">${escHtml(c.name)}</div>
      <div class="channel-desc">${escHtml(c.desc)}</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════
//  REPRODUCTOR
// ══════════════════════════════════════
function openStream(title, url) {
  document.getElementById('playerTitle').textContent = title;
  const frame = document.getElementById('playerFrame');

  if (!url || url.trim() === '') {
    frame.innerHTML = `<div class="no-stream"><div class="icon">🔗</div><h3>Sin stream disponible</h3><p>Este partido/canal aún no tiene un link de transmisión.<br>Agrégalo desde el panel de Admin.</p></div>`;
  } else {
    frame.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media" scrolling="no"></iframe>`;
  }

  document.getElementById('playerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrame').innerHTML = '';
  document.body.style.overflow = '';
}

// ══════════════════════════════════════
//  ADMIN — GUARDAR
// ══════════════════════════════════════
function addMatch() {
  const league = document.getElementById('mLeague').value.trim();
  const home   = document.getElementById('mHome').value.trim();
  const away   = document.getElementById('mAway').value.trim();
  const date   = document.getElementById('mDate').value;
  const time   = document.getElementById('mTime').value;
  const status = document.getElementById('mStatus').value;
  const score  = document.getElementById('mScore').value.trim();
  const stream = document.getElementById('mStream').value.trim();

  if (!home || !away || !date) { toast('⚠️ Completa Equipo Local, Visitante y Fecha'); return; }

  const matches = getMatches();
  matches.push({ id: Date.now(), league, home, away, date, time, status, score, stream });
  saveMatches(matches);
  toast('✅ Partido guardado');
  clearMatchForm();
  renderAdminLists();
}

function addChannel() {
  const name   = document.getElementById('cName').value.trim();
  const emoji  = document.getElementById('cEmoji').value.trim();
  const desc   = document.getElementById('cDesc').value.trim();
  const stream = document.getElementById('cStream').value.trim();

  if (!name) { toast('⚠️ El nombre del canal es obligatorio'); return; }

  const channels = getChannels();
  channels.push({ id: Date.now(), name, emoji: emoji || '📺', desc, stream });
  saveChannels(channels);
  toast('✅ Canal guardado');
  clearChannelForm();
  renderAdminLists();
}

function clearMatchForm() {
  ['mLeague','mHome','mAway','mDate','mTime','mScore','mStream'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('mStatus').value = 'upcoming';
}

function clearChannelForm() {
  ['cName','cEmoji','cDesc','cStream'].forEach(id => document.getElementById(id).value = '');
}

// ══════════════════════════════════════
//  ADMIN — LISTAR / BORRAR
// ══════════════════════════════════════
function renderAdminLists() {
  const matches = getMatches();
  const channels = getChannels();
  const ml = document.getElementById('adminMatchList');
  const cl = document.getElementById('adminChannelList');

  ml.innerHTML = matches.length ? matches.map(m => `
    <div class="item-row">
      <span>${m.home} vs ${m.away} · ${m.date} ${m.time}</span>
      <button class="btn-danger" onclick="deleteMatch(${m.id})">✕</button>
    </div>
  `).join('') : '<p style="color:var(--muted);font-size:13px">Sin partidos</p>';

  cl.innerHTML = channels.length ? channels.map(c => `
    <div class="item-row">
      <span>${c.emoji} ${c.name}</span>
      <button class="btn-danger" onclick="deleteChannel(${c.id})">✕</button>
    </div>
  `).join('') : '<p style="color:var(--muted);font-size:13px">Sin canales</p>';
}

function deleteMatch(id) {
  if (!confirm('¿Borrar este partido?')) return;
  saveMatches(getMatches().filter(m => m.id !== id));
  renderAdminLists();
  renderMatches();
  toast('🗑️ Partido eliminado');
}

function deleteChannel(id) {
  if (!confirm('¿Borrar este canal?')) return;
  saveChannels(getChannels().filter(c => c.id !== id));
  renderAdminLists();
  renderChannels();
  toast('🗑️ Canal eliminado');
}

function clearAll() {
  if (!confirm('¿Borrar TODOS los partidos y canales? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem('ftv_matches');
  localStorage.removeItem('ftv_channels');
  renderMatches();
  renderChannels();
  renderAdminLists();
  toast('🗑️ Todo borrado');
}

// ══════════════════════════════════════
//  TOAST
// ══════════════════════════════════════
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════
//  UTILS
// ══════════════════════════════════════
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
buildDateStrip();
renderMatches();

// Poner fecha de hoy en el input de admin
document.getElementById('mDate').value = new Date().toISOString().split('T')[0];

// Cerrar player con botón atrás
window.addEventListener('popstate', closePlayer);
</script>
</body>
</html>
