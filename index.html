<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FútbolTV">
<meta name="theme-color" content="#0a0e1a">
<title>FútbolTV</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a; --bg2: #111827; --bg3: #1a2235;
    --green: #00e676; --green2: #00c853; --red: #ff1744;
    --text: #f0f4ff; --muted: #8899bb;
    --border: rgba(0,230,118,0.15); --card: rgba(26,34,53,0.95);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  header { background: rgba(10,14,26,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; background: linear-gradient(135deg, var(--green), #69ffb4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .live-badge { background: var(--red); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; letter-spacing: 1px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  .nav-tabs { display: flex; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg2); overflow-x: auto; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; padding: 14px 18px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
  .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* DATE STRIP */
  .date-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; margin-bottom: 16px; }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-pill { display: flex; flex-direction: column; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; min-width: 58px; transition: all 0.2s; flex-shrink: 0; }
  .date-pill.active { background: var(--green); border-color: var(--green); }
  .date-pill.active .day-name, .date-pill.active .day-num { color: #000; }
  .day-name { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .day-num { font-size: 20px; font-weight: 300; color: var(--text); margin-top: 2px; }

  /* MATCH CARD */
  .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .match-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); border-radius: 3px 0 0 3px; }
  .match-card.live::before { background: var(--red); animation: pulse 1.5s infinite; }
  .match-card:active { transform: scale(0.98); }
  .match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .league-name { font-size: 11px; font-weight: 600; color: var(--green); text-transform: uppercase; letter-spacing: 0.8px; }
  .match-time { font-size: 13px; color: var(--muted); font-weight: 500; }
  .match-time.live-time { color: var(--red); font-weight: 700; }
  .teams { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .team-emoji { font-size: 28px; }
  .team-name { font-size: 13px; font-weight: 600; text-align: center; }
  .vs-score { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--text); text-align: center; min-width: 60px; letter-spacing: 2px; }
  .vs-score.live-score { color: var(--green); }

  /* CHANNELS */
  .channels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .channel-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .channel-card:active { transform: scale(0.96); }
  .channel-card:hover { border-color: var(--green); }
  .channel-logo { font-size: 36px; margin-bottom: 8px; }
  .channel-name { font-size: 14px; font-weight: 600; }
  .channel-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* SEARCH */
  .search-bar { position: relative; margin-bottom: 16px; }
  .search-bar input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 12px 40px 12px 14px; outline: none; }
  .search-bar input:focus { border-color: var(--green); }
  .search-bar span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }

  /* PLAYER */
  .player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 200; flex-direction: column; }
  .player-overlay.open { display: flex; }
  .player-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--bg2); flex-shrink: 0; }
  .player-title { font-size: 16px; font-weight: 600; }
  .close-btn { background: rgba(255,255,255,0.1); border: none; color: var(--text); font-size: 22px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .player-frame { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .player-frame iframe, .player-frame video { width: 100%; max-width: 900px; aspect-ratio: 16/9; border: none; border-radius: 12px; background: #000; }
  .no-stream { text-align: center; padding: 40px 20px; }
  .no-stream .icon { font-size: 48px; margin-bottom: 16px; }

  /* ADMIN */
  .admin-section { max-width: 600px; margin: 0 auto; }
  .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .admin-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--green); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 12px 14px; outline: none; transition: border-color 0.2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--green); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--bg2); }
  .btn-primary { width: 100%; background: var(--green); color: #000; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
  .btn-primary:hover { background: var(--green2); }
  .btn-danger { background: var(--red); color: #fff; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; margin-left: 8px; }
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .item-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* M3U */
  .m3u-status { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; display: none; }
  .m3u-status.ok { background: rgba(0,230,118,0.15); color: var(--green); display: block; }
  .m3u-status.err { background: rgba(255,23,68,0.15); color: var(--red); display: block; }
  .m3u-status.loading { background: rgba(255,255,255,0.08); color: var(--muted); display: block; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--green); color: #000; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 50px; z-index: 999; transition: transform 0.3s; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">⚽ FútbolTV</div>
  <span class="live-badge">● EN VIVO</span>
</header>

<nav class="nav-tabs">
  <button class="tab-btn active" onclick="showTab('partidos',this)">📅 Partidos</button>
  <button class="tab-btn" onclick="showTab('canales',this)">📺 Canales</button>
  <button class="tab-btn" onclick="showTab('admin',this)">⚙️ Admin</button>
</nav>

<!-- PARTIDOS -->
<section id="tab-partidos" class="section active">
  <div class="date-strip" id="dateStrip"></div>
  <div id="matchList"></div>
</section>

<!-- CANALES -->
<section id="tab-canales" class="section">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
    <span>🔍</span>
  </div>
  <div class="channels-grid" id="channelGrid"></div>
  <div id="emptyChannels" class="empty-state" style="display:none">
    <div class="e-icon">📺</div>
    <p>No hay canales.<br>Ve a <strong>Admin → Lista M3U</strong> para cargar.</p>
  </div>
</section>

<!-- ADMIN -->
<section id="tab-admin" class="section">
  <div class="admin-section">

    <!-- LISTA M3U -->
    <div class="admin-card">
      <h3>📡 Cargar Lista M3U</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Pega el link de una lista M3U y se cargarán todos los canales automáticamente.</p>
      <label>URL de la lista M3U</label>
      <input type="url" id="m3uUrl" placeholder="http://ejemplo.com/lista.m3u">
      <div id="m3uStatus" class="m3u-status"></div>
      <button class="btn-primary" onclick="loadM3U()">📥 Cargar canales</button>
      <button class="btn-primary" style="background:rgba(255,255,255,0.1);color:var(--text);margin-top:8px" onclick="clearM3UChannels()">🗑️ Borrar canales M3U</button>
    </div>

    <!-- AGREGAR PARTIDO -->
    <div class="admin-card">
      <h3>📅 Agregar Partido</h3>
      <label>Liga / Competición</label>
      <input type="text" id="mLeague" placeholder="Ej: Champions League">
      <label>Equipo Local</label>
      <input type="text" id="mHome" placeholder="Ej: Real Madrid">
      <label>Equipo Visitante</label>
      <input type="text" id="mAway" placeholder="Ej: Barcelona">
      <label>Fecha</label>
      <input type="date" id="mDate">
      <label>Hora (24h)</label>
      <input type="time" id="mTime">
      <label>Estado</label>
      <select id="mStatus">
        <option value="upcoming">Próximo</option>
        <option value="live">EN VIVO</option>
        <option value="finished">Finalizado</option>
      </select>
      <label>Marcador (ej: 2 - 1)</label>
      <input type="text" id="mScore" placeholder="Dejar vacío si no ha empezado">
      <label>Link del stream</label>
      <textarea id="mStream" placeholder="https://..."></textarea>
      <button class="btn-primary" onclick="addMatch()">✅ Guardar Partido</button>
    </div>

    <!-- LISTA PARTIDOS -->
    <div class="admin-card">
      <h3>📋 Partidos guardados</h3>
      <div class="item-list" id="adminMatchList"></div>
    </div>

    <!-- AGREGAR CANAL MANUAL -->
    <div class="admin-card">
      <h3>📺 Agregar Canal Manual</h3>
      <label>Nombre</label>
      <input type="text" id="cName" placeholder="Ej: ESPN">
      <label>Emoji</label>
      <input type="text" id="cEmoji" placeholder="📺">
      <label>Descripción</label>
      <input type="text" id="cDesc" placeholder="Deportes en vivo">
      <label>Link del stream</label>
      <textarea id="cStream" placeholder="https://..."></textarea>
      <button class="btn-primary" onclick="addChannel()">✅ Guardar Canal</button>
    </div>

    <!-- LISTA CANALES -->
    <div class="admin-card">
      <h3>📋 Canales manuales</h3>
      <div class="item-list" id="adminChannelList"></div>
    </div>

    <!-- PELIGRO -->
    <div class="admin-card" style="border-color:rgba(255,23,68,0.3)">
      <h3 style="color:var(--red)">🗑️ Borrar todo</h3>
      <button class="btn-primary" style="background:var(--red);color:#fff" onclick="clearAll()">Borrar todo</button>
    </div>

  </div>
</section>

<!-- REPRODUCTOR -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-header">
    <span class="player-title" id="playerTitle">Cargando...</span>
    <button class="close-btn" onclick="closePlayer()">✕</button>
  </div>
  <div class="player-frame" id="playerFrame"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STORAGE ──
function getMatches()  { try { return JSON.parse(localStorage.getItem('ftv_matches')||'[]'); } catch{ return []; } }
function getChannels() { try { return JSON.parse(localStorage.getItem('ftv_channels')||'[]'); } catch{ return []; } }
function getM3UCh()    { try { return JSON.parse(localStorage.getItem('ftv_m3u')||'[]'); } catch{ return []; } }
function saveMatches(d)  { localStorage.setItem('ftv_matches', JSON.stringify(d)); }
function saveChannels(d) { localStorage.setItem('ftv_channels', JSON.stringify(d)); }
function saveM3UCh(d)    { localStorage.setItem('ftv_m3u', JSON.stringify(d)); }

// ── TABS ──
function showTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='canales') renderChannels();
  if(name==='admin') renderAdminLists();
}

// ── FECHAS ──
let selectedDate='';
function buildDateStrip(){
  const strip=document.getElementById('dateStrip');
  strip.innerHTML='';
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const today=new Date();
  for(let i=-2;i<=7;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const iso=d.toISOString().split('T')[0];
    const pill=document.createElement('div');
    pill.className='date-pill'+(i===0?' active':'');
    pill.innerHTML=`<span class="day-name">${i===0?'HOY':days[d.getDay()]}</span><span class="day-num">${d.getDate()}</span>`;
    pill.onclick=()=>{
      document.querySelectorAll('.date-pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active'); selectedDate=iso; renderMatches();
    };
    if(i===0) selectedDate=iso;
    strip.appendChild(pill);
  }
}

// ── PARTIDOS ──
function renderMatches(){
  const list=document.getElementById('matchList');
  const matches=getMatches().filter(m=>m.date===selectedDate);
  if(!matches.length){ list.innerHTML=`<div class="empty-state"><div class="e-icon">📅</div><p>No hay partidos para este día.<br>Agrega uno en <strong>Admin</strong>.</p></div>`; return; }
  matches.sort((a,b)=>a.time.localeCompare(b.time));
  list.innerHTML=matches.map(m=>`
    <div class="match-card ${m.status==='live'?'live':''}" onclick="openStream('${esc(m.home)} vs ${esc(m.away)}','${esc(m.stream)}')">
      <div class="match-meta">
        <span class="league-name">${esc(m.league)}</span>
        <span class="match-time ${m.status==='live'?'live-time':''}">${m.status==='live'?'● EN VIVO':m.status==='finished'?'FIN':fmtTime(m.time)}</span>
      </div>
      <div class="teams">
        <div class="team"><span class="team-emoji">🏟️</span><span class="team-name">${esc(m.home)}</span></div>
        <div class="vs-score ${m.status==='live'?'live-score':''}">${m.score||'VS'}</div>
        <div class="team"><span class="team-emoji">✈️</span><span class="team-name">${esc(m.away)}</span></div>
      </div>
    </div>`).join('');
}
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':'); const hh=parseInt(h); return `${hh>12?hh-12:hh||12}:${m} ${hh>=12?'PM':'AM'}`; }

// ── CANALES ──
let allChannels=[];
function renderChannels(){
  const grid=document.getElementById('channelGrid');
  const empty=document.getElementById('emptyChannels');
  const manual=getChannels();
  const m3u=getM3UCh();
  allChannels=[...manual,...m3u];
  if(!allChannels.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  renderChannelGrid(allChannels);
}
function renderChannelGrid(list){
  const grid=document.getElementById('channelGrid');
  if(!list.length){ grid.innerHTML=`<div style="grid-column:span 2;text-align:center;padding:40px;color:var(--muted)">No se encontraron canales</div>`; return; }
  grid.innerHTML=list.map(c=>`
    <div class="channel-card" onclick="openStream('${esc(c.name)}','${esc(c.stream)}')">
      <div class="channel-logo">${c.emoji||'📺'}</div>
      <div class="channel-name">${esc(c.name)}</div>
      <div class="channel-desc">${esc(c.desc||'')}</div>
    </div>`).join('');
}
function filterChannels(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=allChannels.filter(c=>c.name.toLowerCase().includes(q));
  renderChannelGrid(filtered);
}

// ── M3U LOADER ──
async function loadM3U(){
  const url=document.getElementById('m3uUrl').value.trim();
  const status=document.getElementById('m3uStatus');
  if(!url){ toast('⚠️ Ingresa una URL'); return; }
  status.className='m3u-status loading';
  status.textContent='⏳ Cargando lista...';
  try {
    // Usar proxy CORS
    const proxy='https://api.allorigins.win/raw?url=';
    const res=await fetch(proxy+encodeURIComponent(url));
    if(!res.ok) throw new Error('No se pudo cargar');
    const text=await res.text();
    const channels=parseM3U(text);
    if(!channels.length) throw new Error('Lista vacía o formato inválido');
    saveM3UCh(channels);
    status.className='m3u-status ok';
    status.textContent=`✅ ${channels.length} canales cargados correctamente`;
    toast(`✅ ${channels.length} canales cargados`);
  } catch(e) {
    status.className='m3u-status err';
    status.textContent='❌ Error: '+e.message+'. Intenta con otra lista.';
  }
}

function parseM3U(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const channels=[];
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF')){
      const info=lines[i];
      const url=lines[i+1]||'';
      if(!url||url.startsWith('#')) continue;
      // Nombre
      const nameMatch=info.match(/,(.+)$/);
      const name=nameMatch?nameMatch[1].trim():'Canal';
      // Grupo
      const groupMatch=info.match(/group-title="([^"]*)"/i);
      const group=groupMatch?groupMatch[1]:'';
      // Solo canales de deportes o todos
      channels.push({ id: Date.now()+i, name, emoji: getEmoji(name,group), desc: group, stream: url.trim() });
      i++;
    }
  }
  return channels;
}

function getEmoji(name, group){
  const n=(name+group).toLowerCase();
  if(n.includes('espn')) return '🟠';
  if(n.includes('fox')) return '🦊';
  if(n.includes('tnt')) return '💥';
  if(n.includes('claro')) return '⭐';
  if(n.includes('bein')) return '🏆';
  if(n.includes('sky')) return '🌤️';
  if(n.includes('premier')) return '🏴󠁧󠁢󠁥󠁮󠁧󠁿';
  if(n.includes('champions')) return '🏆';
  if(n.includes('gol')) return '⚽';
  if(n.includes('sport')) return '🏅';
  if(n.includes('futbol')||n.includes('fútbol')) return '⚽';
  return '📺';
}

function clearM3UChannels(){
  if(!confirm('¿Borrar todos los canales M3U?')) return;
  localStorage.removeItem('ftv_m3u');
  document.getElementById('m3uStatus').className='m3u-status';
  toast('🗑️ Canales M3U borrados');
}

// ── REPRODUCTOR ──
function openStream(title, url){
  document.getElementById('playerTitle').textContent=title;
  const frame=document.getElementById('playerFrame');
  if(!url||url.trim()===''){
    frame.innerHTML=`<div class="no-stream"><div class="icon">🔗</div><h3>Sin stream</h3><p>Este canal no tiene link de transmisión.</p></div>`;
  } else if(url.includes('.m3u8')||url.includes('.ts')){
    // Video nativo para m3u8
    frame.innerHTML=`<video controls autoplay src="${url}"></video>`;
  } else {
    frame.innerHTML=`<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media" scrolling="no"></iframe>`;
  }
  document.getElementById('playerOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePlayer(){
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrame').innerHTML='';
  document.body.style.overflow='';
}

// ── ADMIN ──
function addMatch(){
  const league=document.getElementById('mLeague').value.trim();
  const home=document.getElementById('mHome').value.trim();
  const away=document.getElementById('mAway').value.trim();
  const date=document.getElementById('mDate').value;
  const time=document.getElementById('mTime').value;
  const status=document.getElementById('mStatus').value;
  const score=document.getElementById('mScore').value.trim();
  const stream=document.getElementById('mStream').value.trim();
  if(!home||!away||!date){ toast('⚠️ Completa Local, Visitante y Fecha'); return; }
  const matches=getMatches();
  matches.push({id:Date.now(),league,home,away,date,time,status,score,stream});
  saveMatches(matches);
  toast('✅ Partido guardado');
  ['mLeague','mHome','mAway','mDate','mTime','mScore','mStream'].forEach(id=>document.getElementById(id).value='');
  renderAdminLists();
}
function addChannel(){
  const name=document.getElementById('cName').value.trim();
  const emoji=document.getElementById('cEmoji').value.trim();
  const desc=document.getElementById('cDesc').value.trim();
  const stream=document.getElementById('cStream').value.trim();
  if(!name){ toast('⚠️ El nombre es obligatorio'); return; }
  const channels=getChannels();
  channels.push({id:Date.now(),name,emoji:emoji||'📺',desc,stream});
  saveChannels(channels);
  toast('✅ Canal guardado');
  ['cName','cEmoji','cDesc','cStream'].forEach(id=>document.getElementById(id).value='');
  renderAdminLists();
}
function renderAdminLists(){
  const matches=getMatches();
  const channels=getChannels();
  document.getElementById('adminMatchList').innerHTML=matches.length?matches.map(m=>`
    <div class="item-row"><span>${m.home} vs ${m.away} · ${m.date}</span><button class="btn-danger" onclick="deleteMatch(${m.id})">✕</button></div>`).join(''):'<p style="color:var(--muted);font-size:13px">Sin partidos</p>';
  document.getElementById('adminChannelList').innerHTML=channels.length?channels.map(c=>`
    <div class="item-row"><span>${c.emoji} ${c.name}</span><button class="btn-danger" onclick="deleteChannel(${c.id})">✕</button></div>`).join(''):'<p style="color:var(--muted);font-size:13px">Sin canales</p>';
}
function deleteMatch(id){ if(!confirm('¿Borrar?')) return; saveMatches(getMatches().filter(m=>m.id!==id)); renderAdminLists(); renderMatches(); toast('🗑️ Eliminado'); }
function deleteChannel(id){ if(!confirm('¿Borrar?')) return; saveChannels(getChannels().filter(c=>c.id!==id)); renderAdminLists(); toast('🗑️ Eliminado'); }
function clearAll(){ if(!confirm('¿Borrar TODO?')) return; localStorage.removeItem('ftv_matches'); localStorage.removeItem('ftv_channels'); localStorage.removeItem('ftv_m3u'); renderMatches(); renderChannels(); renderAdminLists(); toast('🗑️ Todo borrado'); }

// ── UTILS ──
function esc(s){ return s?String(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):''; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

// ── INIT ──
buildDateStrip();
renderMatches();
document.getElementById('mDate').value=new Date().toISOString().split('T')[0];
window.addEventListener('popstate', closePlayer);
</script>
</body>
</html>
